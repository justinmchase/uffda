[package]
name = "uffda-runtime"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Side-by-side Rust implementation of the Uffda runtime"

[[bin]]
name = "uffda"
path = "src/main.rs"

[workspace]
members = ["heap", "heap/derive"]
default-members = [".", "heap", "heap/derive"]

[features]
default = ["mimalloc"]
# Use mimalloc as the `uffda` binary's global allocator instead of the system
# allocator.
mimalloc = ["dep:mimalloc"]
# Diagnostic: run on the never-freeing heap backend. Not for production use.
heap-leak = ["uffda-heap/leak"]

[dependencies]
uffda-heap = { path = "heap" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
ryu-js = "1"
url = "2"
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"
jsonc-parser = { version = "0.29", features = ["serde"] }
deno_semver = "0.10"
bs58 = "0.5"
regex = "1"
regress = { version = "0.11", features = ["utf16"] }
globwalk = "0.9"
pathdiff = "0.2"
time = { version = "0.3", features = ["parsing", "formatting"] }
base64 = "0.22"
num-bigint = "0.4"
mimalloc = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
