[package]
name = "uffda-runtime"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Side-by-side Rust implementation of the Uffda runtime"

[dependencies]
gc-arena = "=0.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ryu-js = "1"
url = "2"
