# Cargo aliases for the Rust workspace under rust/.
# Chain Format + Clippy + Test (Checks job) with: deno task check:rust
[alias]
fmt-rust = "fmt --manifest-path rust/Cargo.toml --all"
fmt-rust-check = "fmt --manifest-path rust/Cargo.toml --all --check"
clippy-rust = "clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings"
test-rust = "test --manifest-path rust/Cargo.toml --workspace --locked"
