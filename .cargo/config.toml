# Cargo aliases for the root Rust workspace.
# Multi-step Checks gate: cargo xtask check  (or cargo xtask fix)
[alias]
xtask = "run -p xtask --"
fmt-rust = "fmt --all"
fmt-rust-check = "fmt --all --check"
clippy-rust = "clippy --workspace --all-targets --locked --features embed-languages -- -D warnings"
test-rust = "test --workspace --locked --features embed-languages"
build-uffda = "build --bin uffda --features embed-languages"
