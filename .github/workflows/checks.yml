name: Checks
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Lcov
        run: sudo apt install lcov -y

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Uffda CLI
        uses: ./.github/actions/uffda-setup
        with:
          version: latest

      - name: Lint
        run: deno lint

      - name: Format
        run: deno fmt --check

      - name: Type Check
        run: deno check mod.ts

      - name: Jsr
        run: npx jsr publish --dry-run

      - name: Compile language modules
        run: |
          set -euo pipefail
          # Bootstrap ./bin using the previous published `uffda compile` CLI,
          # which parses and lowers .uff to ModuleDeclaration JSON in one step
          # (see compiler-bootstrap.spec.md).
          deno task compile:lang
          test -f ./bin/ast/src/lang/common/characters/digit.uffda.ast.json
          test -f ./bin/ast/src/lang/common/characters/connecting.uffda.ast.json
          test -f ./bin/ast/src/lang/common/characters/formatting.uffda.ast.json
          test -f ./bin/ast/src/lang/common/characters/letter.uffda.ast.json
          test -f ./bin/ast/src/lang/common/characters/combining.uffda.ast.json
          test -f ./bin/ast/src/lang/common/characters/whitespace.uffda.ast.json
          test -f ./bin/ast/src/lang/common/characters/newLine.uffda.ast.json
          test -f ./bin/ast/src/lang/common/characters/mod.uffda.ast.json
          test -f ./bin/ast/src/lang/common/identifier.uffda.ast.json
          test -f ./bin/ast/src/lang/common/surround.uffda.ast.json
          test -f ./bin/ast/src/lang/tokenizer/token.uffda.ast.json
          test -f ./bin/ast/src/lang/common/spread.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/boolean.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/nullish.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/reference.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/terminal.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/not.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/array.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/object.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/sequence.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/member.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/string.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/primary.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/unary.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/expression.uffda.ast.json
          test -f ./bin/ast/src/lang/pattern/atoms.uffda.ast.json
          test -f ./bin/ast/src/lang/pattern/then.uffda.ast.json
          test -f ./bin/ast/src/lang/pattern/pipe.uffda.ast.json
          test -f ./bin/ast/src/lang/pattern/and.uffda.ast.json
          test -f ./bin/ast/src/lang/pattern/or.uffda.ast.json
          test -f ./bin/ast/src/lang/pattern/pattern.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/expression.lang.uffda.ast.json
          test -f ./bin/ast/src/lang/pattern/pattern.lang.uffda.ast.json
          test -f ./bin/ast/src/lang/pattern/atomic.uffda.ast.json
          test -f ./bin/ast/src/lang/uffda/shared.rules.uffda.ast.json
          test -f ./bin/ast/src/lang/uffda/import.rules.uffda.ast.json
          test -f ./bin/ast/src/lang/uffda/export.rules.uffda.ast.json
          test -f ./bin/ast/src/lang/uffda/rule.rules.uffda.ast.json
          test -f ./bin/ast/src/lang/uffda/uffda.lang.uffda.ast.json
          test -f ./bin/ast/src/lang/uffda/runtime.compiler.uffda.ast.json
          test -f ./bin/ast/src/lang/expression/number.uffda.ast.json

      - name: Test
        # Allow read is required to run resolve tests. Language `.uff` modules
        # load from ./bin produced by the prior compile step. Slow full-compile
        # integration tests live under test/integration/ and run in the
        # separate, parallel "Integration" job below instead.
        run: deno test --allow-read --allow-write --parallel --coverage=cov_profile --ignore=test/integration/

      - name: Bootstrap import from ./bin
        run: |
          set -euo pipefail
          # Proves workflow-produced ./bin is what .uff import remapping loads.
          deno test --allow-read --allow-write \
            ./src/requirements/cli-bootstrap/005-ci-compile-then-import.requirement.test.ts

      - name: Coverage
        run: |
          set -e -o pipefail
          deno coverage cov_profile --lcov --output=cov_profile.lcov

          cat << EOF >> $GITHUB_STEP_SUMMARY
          ### Code Coverage
          \`\`\`
          $(lcov --summary cov_profile.lcov)
          \`\`\`
          EOF

  integration:
    name: Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Uffda CLI
        uses: ./.github/actions/uffda-setup
        with:
          version: latest

      - name: Compile language modules
        run: deno task compile:lang

      - name: Integration tests
        # Slow, full-compile end-to-end tests (see test/README.md). Runs as
        # its own job so it never blocks fast feedback (lint/format/unit
        # tests) from the main Checks job.
        run: deno test --allow-read --allow-write --parallel test/integration/

  perf:
    name: Perf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Uffda CLI
        uses: ./.github/actions/uffda-setup
        with:
          version: latest

      - name: Compile language modules
        run: deno task compile:lang

      - name: Perf report
        # Reports .uff compile-time scaling (see test/perf/README.md and
        # test/perf/morse-compile.report.ts). Not a pass/fail gate today —
        # it exists to surface superlinear regressions visibly in CI output
        # alongside bench/integration, without blocking the main Checks job.
        # Attaches the full size/time table to the job summary.
        run: >-
          deno run --allow-read --allow-write --allow-env=GITHUB_STEP_SUMMARY
          test/perf/morse-compile.report.ts
