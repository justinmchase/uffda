name: Checks
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  specs:
    name: Specs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Specs audit
        uses: justinmchase/specs@v1

  rust:
    name: Rust
    needs: rust-language-bin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: Compiled languages
        uses: actions/download-artifact@v8
        with:
          name: rust-language-bin
          path: bin

      - name: Lint
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

  rust-language-bin:
    name: Rust language artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/uffda-setup
        with:
          version: latest
      - name: Bootstrap with published compiler
        run: rm -rf ./bin && uffda compile 'src/lang/**/*.uff'
      - uses: actions/upload-artifact@v7
        with:
          name: rust-language-bin
          path: bin/
          if-no-files-found: error

  rust-codec:
    name: Rust standalone ${{ matrix.target }}
    needs: rust-language-bin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: rust-language-bin
          path: bin
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test codec acceptance example
        run: cargo test --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --example codec_probe
      - name: Build standalone CLI and streaming consumer
        run: cargo build --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --release --bin uffda --example codec_probe
      - name: Verify relocated CLI and streaming without external grammars
        shell: bash
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          suffix="${{ matrix.suffix }}"
          export UFFDA_ACCEPT_CLI="$PWD/rust/target/${target}/release/uffda${suffix}"
          export UFFDA_ACCEPT_PROBE="$PWD/rust/target/${target}/release/examples/codec_probe${suffix}"
          cargo test --locked --manifest-path rust/Cargo.toml --target "${target}" --test standalone_acceptance -- --ignored

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check-types

      - name: Compile
        run: npm run compile

      - name: Package .vsix
        run: npm run package
