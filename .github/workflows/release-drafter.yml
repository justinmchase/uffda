name: Release Drafter

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  draft-release:
    name: Draft Release
    # Skip the version-bump bot commit to avoid a second draft/dispatch cycle.
    if: >
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       !contains(github.event.head_commit.message, '[no ci]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      resolved_version: ${{ steps.release.outputs.resolved_version }}
    steps:
      - id: release
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: autolabeler
        if: ${{ github.event_name == 'pull_request' }}
        uses: release-drafter/release-drafter/autolabeler@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-version:
    needs: draft-release
    name: Update Version
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: optum/semver-cli/setup@main
        with:
          version: 0.9.7
          token: ${{ steps.app-token.outputs.token }}

      - name: Set Version
        id: set-version
        run: |
          semver set ${{ needs.draft-release.outputs.resolved_version }}
          if [ -z $(git status --porcelain) ];
          then
              echo "no changes to commit."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          cat >> $GITHUB_STEP_SUMMARY<<EOF
          # Version
          \`\`\`
          ${{ needs.draft-release.outputs.resolved_version }}
          \`\`\`
          EOF

          git config user.name  bustin-base[bot]
          git config user.email 177288331+bustin-base[bot]@users.noreply.github.com
          gh auth setup-git

          git add .
          git commit -m '${{ needs.draft-release.outputs.resolved_version }}[no ci]'
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Dispatch attach draft CLI binaries
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          version="${{ needs.draft-release.outputs.resolved_version }}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/dispatches" \
            -f event_type='release-binaries' \
            -f "client_payload[version]=${version}" \
            -f "client_payload[reason]=release-drafter"
          {
            echo "## Release binaries"
            echo
            echo "Dispatched \`repository_dispatch\` event \`release-binaries\` for draft \`${version}\`."
            echo
            echo "You can also re-run [Release Binaries](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release-binaries.yml) manually."
          } >> "$GITHUB_STEP_SUMMARY"
