name: Release Binaries

# Compile the CLI from a pinned main revision and attach (replace) release
# assets on a GitHub Release. uffda-* assets are the Rust CLI and embed the
# bootstrapped language ASTs.
# Draft Release already sets tag_name/target_commitish; this workflow only
# builds and uploads. Publishing the draft creates the version tag.
#
# Triggered by Draft Release via repository_dispatch, or manually via
# workflow_dispatch (optional tag= to recover a published-but-empty release).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: >
          Release tag to attach to (bare SemVer). Leave empty for the latest
          draft. Use a published tag only to recover a release with no CLI
          assets yet.
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [release-binaries]

concurrency:
  group: release-binaries
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve release target
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      sha: ${{ steps.target.outputs.sha }}
      release_id: ${{ steps.target.outputs.release_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Resolve release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version || '' }}
        shell: bash
        run: |
          set -euo pipefail

          # Draft releases are untagged until publish. Looking them up by tag
          # name via the releases-by-tag REST route 404s; resolve via
          # `gh release view` (GraphQL fallback) or GET /releases/:id instead.
          cli_asset_count() {
            local meta="$1"
            jq '[.assets[] | select(.name == "SHA256SUMS" or (.name | startswith("uffda-")))] | length' \
              <<< "${meta}"
          }

          if [[ -n "${INPUT_TAG}" ]]; then
            tag="${INPUT_TAG#v}"
          elif [[ -n "${DISPATCH_VERSION}" ]]; then
            tag="${DISPATCH_VERSION#v}"
          else
            tag="$(
              gh release list --limit 50 --json tagName,isDraft,createdAt \
                --jq '[.[] | select(.isDraft == true)] | sort_by(.createdAt) | reverse | .[0].tagName // empty'
            )"
            if [[ -z "${tag}" || "${tag}" == "null" ]]; then
              echo "No draft release found. Merge to main so Draft Release can create one," >&2
              echo "or re-run with workflow_dispatch input tag=<published-empty-tag>." >&2
              exit 1
            fi
            tag="${tag#v}"
          fi

          if ! meta="$(gh release view "${tag}" --json tagName,isDraft,databaseId,assets)"; then
            echo "No GitHub release for tag ${tag}." >&2
            exit 1
          fi
          is_draft="$(jq -r .isDraft <<< "${meta}")"
          release_id="$(jq -r .databaseId <<< "${meta}")"
          asset_count="$(cli_asset_count "${meta}")"
          if [[ "${is_draft}" != "true" && "${asset_count}" != "0" ]]; then
            echo "Published release ${tag} already has CLI assets; refusing to retarget." >&2
            exit 1
          fi

          version="${tag}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          sha="$(git rev-parse HEAD)"

          if [[ "${file_version}" != "${version}" ]]; then
            echo "WARNING: VERSION=${file_version} does not match release tag ${version}." >&2
            echo "Using the release tag for artifact names; prefer waiting for the version bump commit on main." >&2
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          {
            echo "### Release target"
            echo
            echo "- Tag: \`${tag}\`"
            echo "- Release id: \`${release_id}\`"
            echo "- Draft: \`${is_draft}\`"
            echo "- Build commit: \`${sha}\`"
            echo "- Source branch: \`main\`"
            echo "- VERSION file: \`${file_version}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  compile-lang:
    name: Compile language ./bin
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile language modules into ./bin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Seed ./bin from the latest published CLI asset so Cargo can embed it,
          # then rewrite ./bin with the Rust compiler. This job does not use Deno.
          repo="${{ github.repository }}"
          tmp="$(mktemp -d)"
          # gh release list no longer exposes assets in --json; use the REST API.
          tag="$(
            gh api "repos/${repo}/releases" --paginate \
              --jq '[.[] | select(.draft == false and .prerelease == false) | select(any(.assets[]; .name == "SHA256SUMS") and any(.assets[]; .name | startswith("uffda-")))][0].tag_name'
          )"
          if [[ -z "${tag}" || "${tag}" == "null" ]]; then
            echo "No installable published release" >&2
            exit 1
          fi
          echo "Seeding language artifacts with published CLI from ${tag}"
          gh release download "$tag" --repo "$repo" --dir "$tmp" \
            --pattern 'uffda-*-x86_64-unknown-linux-gnu' --pattern 'SHA256SUMS'
          asset="$(basename "$(find "$tmp" -maxdepth 1 -type f -name 'uffda-*-x86_64-unknown-linux-gnu')")"
          expected="$(awk -v name="$asset" '$2 == name { print $1; exit }' "$tmp/SHA256SUMS")"
          actual="$(sha256sum "$tmp/$asset" | awk '{ print $1 }')"
          if [[ -z "${expected}" || "${actual}" != "${expected}" ]]; then
            echo "Checksum mismatch for ${asset}" >&2
            exit 1
          fi
          chmod +x "$tmp/$asset"
          "$tmp/$asset" --version
          rm -rf ./bin
          "$tmp/$asset" compile 'src/lang/**/*.uff'
          cargo build --locked --release --manifest-path rust/Cargo.toml --features embed-languages --bin uffda
          rm -rf ./bin
          ./rust/target/release/uffda compile 'src/lang/**/*.uff'
          test -f ./bin/ast/src/lang/common/characters/digit.uff.ast.json
          test -f ./bin/ast/src/lang/common/identifier.uff.ast.json
          test -f ./bin/ast/src/lang/common/surround.uff.ast.json
          test -f ./bin/ast/src/lang/tokenizer/token.uff.ast.json
          test -f ./bin/ast/src/lang/common/spread.uff.ast.json
          test -f ./bin/ast/src/lang/expression/boolean.uff.ast.json
          test -f ./bin/ast/src/lang/expression/nullish.uff.ast.json
          test -f ./bin/ast/src/lang/expression/reference.uff.ast.json
          test -f ./bin/ast/src/lang/expression/terminal.uff.ast.json
          test -f ./bin/ast/src/lang/expression/not.uff.ast.json
          test -f ./bin/ast/src/lang/expression/array.uff.ast.json
          test -f ./bin/ast/src/lang/expression/object.uff.ast.json
          test -f ./bin/ast/src/lang/expression/sequence.uff.ast.json
          test -f ./bin/ast/src/lang/expression/primary.uff.ast.json
          test -f ./bin/ast/src/lang/expression/unary.uff.ast.json
          test -f ./bin/ast/src/lang/expression/expression.uff.ast.json
          test -f ./bin/ast/src/lang/pattern/atoms.uff.ast.json
          test -f ./bin/ast/src/lang/pattern/then.uff.ast.json
          test -f ./bin/ast/src/lang/pattern/pipe.uff.ast.json
          test -f ./bin/ast/src/lang/pattern/and.uff.ast.json
          test -f ./bin/ast/src/lang/pattern/or.uff.ast.json
          test -f ./bin/ast/src/lang/pattern/pattern.uff.ast.json
          test -f ./bin/ast/src/lang/expression/expression.lang.uff.ast.json
          test -f ./bin/ast/src/lang/pattern/pattern.lang.uff.ast.json
          test -f ./bin/ast/src/lang/pattern/atomic.uff.ast.json
          test -f ./bin/ast/src/lang/uffda/shared.rules.uff.ast.json
          test -f ./bin/ast/src/lang/uffda/import.rules.uff.ast.json
          test -f ./bin/ast/src/lang/uffda/export.rules.uff.ast.json
          test -f ./bin/ast/src/lang/uffda/rule.rules.uff.ast.json
          test -f ./bin/ast/src/lang/uffda/uffda.lang.uff.ast.json
          test -f ./bin/ast/src/lang/uffda/runtime.compiler.uff.ast.json
          test -f ./bin/ast/src/lang/expression/number.uff.ast.json

      - name: Upload language bin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: language-bin
          path: bin/
          if-no-files-found: error

  compile-rust:
    name: Compile uffda ${{ matrix.target }}
    needs: [prepare, compile-lang]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: ""
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            suffix: ".exe"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-15
            target: aarch64-apple-darwin
            suffix: ""
    steps:
      - name: Checkout build commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download language bin artifacts
        uses: actions/download-artifact@v8
        with:
          name: language-bin
          path: bin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build uffda with embedded language ASTs
        run: cargo build --locked --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --release --features embed-languages --bin uffda --example codec_probe

      - name: Package CLI binary and portable checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          suffix="${{ matrix.suffix }}"
          out_dir="dist/cli"
          mkdir -p "${out_dir}"
          if [[ "${target}" == *windows* ]]; then
            asset="uffda-${version}-${target}.exe"
          else
            asset="uffda-${version}-${target}"
          fi
          cp "rust/target/${target}/release/uffda${suffix}" "${out_dir}/${asset}"
          if [[ "${target}" != *windows* ]]; then
            chmod +x "${out_dir}/${asset}"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${out_dir}/${asset}" | tee "${out_dir}/${asset}.sha256"
          else
            shasum -a 256 "${out_dir}/${asset}" | tee "${out_dir}/${asset}.sha256"
          fi

      - name: Verify embedded runtime and streaming outside checkout
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          target="${{ matrix.target }}"
          suffix="${{ matrix.suffix }}"
          if [[ "${target}" == *windows* ]]; then
            asset="uffda-${version}-${target}.exe"
          else
            asset="uffda-${version}-${target}"
          fi
          export UFFDA_ACCEPT_CLI="$PWD/dist/cli/${asset}"
          export UFFDA_ACCEPT_PROBE="$PWD/rust/target/${target}/release/examples/codec_probe${suffix}"
          cargo test --locked --manifest-path rust/Cargo.toml --target "${target}" --features embed-languages --test standalone_acceptance -- --ignored

      - name: Upload uffda artifact
        uses: actions/upload-artifact@v7
        with:
          name: uffda-${{ matrix.target }}
          path: dist/cli/*
          if-no-files-found: error

  attach:
    name: Attach assets to release
    needs: [prepare, compile-rust]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.prepare.outputs.tag }}
      version: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout build commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Download compiled binaries
        uses: actions/download-artifact@v8
        with:
          # Only CLI target artifacts — not language-bin (./bin AST tree).
          pattern: uffda-*
          path: dist/cli
          merge-multiple: true

      - name: Assemble checksums and install script
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.prepare.outputs.version }}"
          cd dist/cli
          rm -f *.sha256
          : > SHA256SUMS
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc \
            x86_64-apple-darwin \
            aarch64-apple-darwin
          do
            if [[ "${target}" == *windows* ]]; then
              asset="uffda-${version}-${target}.exe"
            else
              asset="uffda-${version}-${target}"
            fi
            if [[ ! -f "${asset}" ]]; then
              echo "Missing required asset ${asset}" >&2
              exit 1
            fi
            sha256sum "${asset}" >> SHA256SUMS
          done
          cp "${GITHUB_WORKSPACE}/scripts/install.sh" ./install.sh
          chmod +x ./install.sh
          sha256sum install.sh >> SHA256SUMS
          {
            echo "### CLI assets"
            echo
            echo "\`\`\`"
            ls -1
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          ls -la

      - name: Replace assets on release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          release_id="${{ needs.prepare.outputs.release_id }}"
          repo="${{ github.repository }}"

          # Draft: always attach. Published: only if CLI assets are still missing
          # (recovery when the draft was published while the matrix was building).
          # Never look up by tag-name REST route here — untagged drafts 404
          # until publish creates the git tag.
          meta="$(gh api "repos/${repo}/releases/${release_id}")"
          is_draft="$(jq -r .draft <<< "${meta}")"
          asset_count="$(
            jq '[.assets[] | select(.name == "SHA256SUMS" or (.name | startswith("uffda-")))] | length' \
              <<< "${meta}"
          )"
          if [[ "${is_draft}" != "true" && "${asset_count}" != "0" ]]; then
            echo "Release ${tag} is published and already has CLI assets; refusing to replace." >&2
            exit 1
          fi
          if [[ "${is_draft}" != "true" ]]; then
            echo "Release ${tag} was published with no CLI assets; attaching recovery upload." >&2
          fi

          # Retry uploads; concurrent runs or transient upload API errors can 404.
          # Upload files only — never directories (e.g. stray language AST trees).
          # `gh release upload <tag>` resolves untagged drafts via GraphQL.
          assets=()
          for path in dist/cli/*; do
            [[ -f "${path}" ]] || continue
            base="$(basename "${path}")"
            case "${base}" in
              uffda-*|SHA256SUMS|install.sh)
                assets+=("${path}")
                ;;
            esac
          done
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No CLI assets found under dist/cli" >&2
            ls -la dist/cli >&2 || true
            exit 1
          fi
          for attempt in 1 2 3; do
            if gh release upload "${tag}" "${assets[@]}" --clobber; then
              echo "Attached/replaced CLI assets on release ${tag} (id ${release_id})"
              exit 0
            fi
            echo "Upload attempt ${attempt} failed; retrying..." >&2
            sleep $((attempt * 2))
          done
          echo "Failed to upload CLI assets to release ${tag} (id ${release_id})" >&2
          exit 1

  smoke:
    name: Smoke install via uffda-setup
    needs: [prepare, attach]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout build commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install draft CLI
        id: setup
        uses: ./.github/actions/uffda-setup
        with:
          version: ${{ needs.prepare.outputs.tag }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Verify installed CLI
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ needs.prepare.outputs.version }}"
          actual="$(uffda --version | tr -d '[:space:]')"
          # Artifact names use the draft tag; the embedded binary version comes from
          # src/version.ts on main and should match after the version bump lands.
          if [[ "${actual}" != "${expected}" ]]; then
            echo "WARNING: uffda --version is ${actual}, draft tag is ${expected}" >&2
          fi
          uffda --help >/dev/null
          echo "Smoke OK: uffda ${actual} (${{ steps.setup.outputs.target }})"
