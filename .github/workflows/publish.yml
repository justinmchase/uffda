name: Publish
# crates.io libraries via OIDC trusted publishing. CLI binaries attach earlier
# via Release Binaries. JSR publishes .uff sources, compiled declaration JSON,
# and package exports (including data-codec surfaces) for jsr: resolution.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  crates-io:
    name: crates.io
    runs-on: ubuntu-latest
    # Must match the Trusted Publishing "environment" on each crate at crates.io
    # (optional there; if set on crates.io, this name must match). Create the
    # GitHub Environment under Settings → Environments if you want protection rules.
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Align crate versions with the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)"
          if [[ "$ver" != "$tag" ]]; then
            echo "rust/Cargo.toml version ${ver} != release tag ${tag}" >&2
            exit 1
          fi
          for manifest in rust/heap/Cargo.toml rust/heap/derive/Cargo.toml rust/build/Cargo.toml; do
            mver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$manifest" | head -1)"
            if [[ "$mver" != "$tag" ]]; then
              echo "${manifest} version ${mver} != release tag ${tag}" >&2
              exit 1
            fi
          done

      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish libraries
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Dependency order. Product grammars are not embedded (default features).
          cargo publish -p uffda-heap-derive --manifest-path rust/Cargo.toml --locked
          cargo publish -p uffda-heap --manifest-path rust/Cargo.toml --locked
          cargo publish -p uffda-build --manifest-path rust/Cargo.toml --locked
          cargo publish -p uffda-runtime --manifest-path rust/Cargo.toml --locked

  jsr:
    name: JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Uffda CLI
        # Cargo embeds ./bin while building. The published CLI only seeds that
        # tree; the Rust compiler rewrites it below.
        uses: ./.github/actions/uffda-setup
        with:
          version: ${{ github.event.release.tag_name || 'latest' }}

      - name: Compile language modules into ./bin
        run: |
          set -euo pipefail
          uffda --version
          rm -rf ./bin
          uffda compile 'src/lang/**/*.uff'
          cargo build --locked --release --manifest-path rust/Cargo.toml --features embed-languages --bin uffda
          rm -rf ./bin
          ./rust/target/release/uffda compile 'src/lang/**/*.uff'
          test -f ./bin/ast/src/lang/uffda/uffda.lang.uffda.ast.json
          test -f ./bin/ast/src/lang/uffda/runtime.compiler.uffda.ast.json

      - name: Verify ./bin is in the JSR package
        run: |
          set -euo pipefail
          npx jsr publish --dry-run 2>&1 | tee "$RUNNER_TEMP/jsr-dry-run.log"
          grep -q "bin/ast/src/lang/uffda/uffda.lang.uffda.ast.json" "$RUNNER_TEMP/jsr-dry-run.log"

      - name: Publish to JSR
        run: npx jsr publish
