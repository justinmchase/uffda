name: Publish
# crates.io libraries via OIDC trusted publishing. CLI binaries attach earlier
# via Release Binaries. JSR publishes .uff sources, compiled declaration JSON,
# and package exports (including data-codec surfaces) for jsr: resolution.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  crates-io:
    name: crates.io
    runs-on: ubuntu-latest
    # Must match the Trusted Publishing "environment" on each crate at crates.io
    # (optional there; if set on crates.io, this name must match). Create the
    # GitHub Environment under Settings → Environments if you want protection rules.
    environment: crates-io
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Align crate versions with the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          tag="${tag#v}"
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' rust/Cargo.toml | head -1)"
          if [[ "$ver" != "$tag" ]]; then
            echo "rust/Cargo.toml version ${ver} != release tag ${tag}" >&2
            exit 1
          fi
          for manifest in rust/heap/Cargo.toml rust/heap/derive/Cargo.toml rust/build/Cargo.toml rust/codec/Cargo.toml; do
            mver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$manifest" | head -1)"
            if [[ "$mver" != "$tag" ]]; then
              echo "${manifest} version ${mver} != release tag ${tag}" >&2
              exit 1
            fi
          done

      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish libraries
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          # Dependency order. Product grammars are not embedded (default features).
          cargo publish -p uffda-heap-derive --manifest-path rust/Cargo.toml --locked
          cargo publish -p uffda-heap --manifest-path rust/Cargo.toml --locked
          cargo publish -p uffda-build --manifest-path rust/Cargo.toml --locked
          cargo publish -p uffda-codec --manifest-path rust/Cargo.toml --locked
          cargo publish -p uffda-runtime --manifest-path rust/Cargo.toml --locked

  jsr:
    name: JSR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Uffda CLI
        # Use the release's CLI assets (attached by Release Binaries before
        # publish). Do not rebuild Rust here — JSR only needs ./bin.
        uses: ./.github/actions/uffda-setup
        with:
          version: ${{ github.event.release.tag_name || 'latest' }}

      - name: Compile language modules into ./bin
        run: |
          set -euo pipefail
          uffda --version
          rm -rf ./bin
          # Full ModuleDeclaration JSON on stdout floods the log (~MBs) and
          # looks like a hang; keep a copy for debugging failures.
          uffda compile 'src/lang/**/*.uff' >"$RUNNER_TEMP/uffda-compile.json"
          test -f ./bin/ast/src/lang/uffda/uffda.lang.uff.ast.json
          test -f ./bin/ast/src/lang/uffda/runtime.compiler.uff.ast.json

      - name: Verify stub + ./bin are in the JSR package
        run: |
          set -euo pipefail
          # uffda-setup already installs Deno; avoid the npx jsr download wrapper.
          deno publish --dry-run 2>&1 | tee "$RUNNER_TEMP/jsr-dry-run.log"
          grep -q "bin/ast/src/lang/uffda/uffda.lang.uff.ast.json" "$RUNNER_TEMP/jsr-dry-run.log"
          grep -qE '(^|/)mod\.ts' "$RUNNER_TEMP/jsr-dry-run.log"
          grep -q "uffda.jsonc" "$RUNNER_TEMP/jsr-dry-run.log"
          # Deno implementation TypeScript must not ship on JSR after cutover.
          if grep -E 'src/(runtime|cli)/.*\.ts' "$RUNNER_TEMP/jsr-dry-run.log"; then
            echo "unexpected Deno TypeScript paths in JSR package" >&2
            exit 1
          fi

      - name: Publish to JSR
        # Upload + provenance often takes ~20–25m with little log output.
        # jsr.io status polling sometimes resets the connection mid-publish;
        # retry rather than failing the whole release on a single blip.
        timeout-minutes: 60
        run: |
          set -euo pipefail
          echo "JSR publish can take ~20–25 minutes (upload + provenance); retrying on connection errors."
          attempts=5
          delay=30
          for i in $(seq 1 "$attempts"); do
            echo "JSR publish attempt ${i}/${attempts}"
            if deno publish; then
              exit 0
            fi
            status=$?
            if [[ "$i" -eq "$attempts" ]]; then
              echo "JSR publish failed after ${attempts} attempts (last exit ${status})" >&2
              exit "$status"
            fi
            echo "Attempt ${i} failed (exit ${status}); sleeping ${delay}s before retry..."
            sleep "$delay"
            delay=$((delay * 2))
          done
