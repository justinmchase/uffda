name: Publish
# JSR package publish on release publish. CLI binaries are attached to the draft
# release earlier via Attach Draft CLI Binaries (repository_dispatch /
# workflow_dispatch).
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - run: npx jsr publish
