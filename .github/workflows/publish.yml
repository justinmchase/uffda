name: Publish
# Language artifacts for a release are compiled with the Rust CLI. JSR publish is
# paused. CLI binaries are attached to the draft release earlier via Release
# Binaries (repository_dispatch / workflow_dispatch).
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Uffda CLI
        # Cargo embeds ./bin while building. The published CLI only seeds that
        # tree; the Rust compiler rewrites it below.
        uses: ./.github/actions/uffda-setup
        with:
          version: ${{ github.event.release.tag_name || 'latest' }}

      - name: Compile language modules into ./bin
        run: |
          set -euo pipefail
          uffda --version
          rm -rf ./bin
          uffda compile 'src/lang/**/*.uff'
          cargo build --locked --release --manifest-path rust/Cargo.toml --bin uffda
          rm -rf ./bin
          ./rust/target/release/uffda compile 'src/lang/**/*.uff'
          test -f ./bin/ast/src/lang/uffda/uffda.lang.uffda.ast.json
          test -f ./bin/ast/src/lang/uffda/runtime.compiler.uffda.ast.json

      - name: Verify ./bin is in the package
        run: |
          set -euo pipefail
          npx jsr publish --dry-run 2>&1 | tee "$RUNNER_TEMP/jsr-dry-run.log"
          grep -q "bin/ast/src/lang/uffda/uffda.lang.uffda.ast.json" "$RUNNER_TEMP/jsr-dry-run.log"

      # TODO: publish the package again once publishing is driven by the Rust CLI.
      # - run: npx jsr publish
