name: Setup Uffda CLI
description: Install the Uffda CLI binary from GitHub Releases for the runner OS/arch.
inputs:
  version:
    description: >
      Release tag or SemVer to install (for example 0.1.2 or v0.1.2).
      Use latest to install the newest GitHub Release.
    required: false
    default: latest
  repository:
    description: GitHub repository that publishes Uffda release binaries.
    required: false
    default: justinmchase/uffda
  github-token:
    description: Optional token for GitHub API rate limits and draft releases.
    required: false
    default: ${{ github.token }}
outputs:
  version:
    description: Installed CLI version without a leading v.
    value: ${{ steps.install.outputs.version }}
  target:
    description: Deno compile target that was installed.
    value: ${{ steps.install.outputs.target }}
  path:
    description: Absolute path to the installed uffda binary.
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - name: Setup Deno
      uses: denoland/setup-deno@v2
      with:
        deno-version: v2.x

    - name: Install Uffda CLI
      id: install
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
        RUNNER_OS: ${{ runner.os }}
        RUNNER_ARCH: ${{ runner.arch }}
      run: |
        set -euo pipefail

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64) target="x86_64-unknown-linux-gnu" ;;
          Linux-ARM64) target="aarch64-unknown-linux-gnu" ;;
          Windows-X64) target="x86_64-pc-windows-msvc" ;;
          Windows-ARM64) target="aarch64-pc-windows-msvc" ;;
          macOS-X64) target="x86_64-apple-darwin" ;;
          macOS-ARM64) target="aarch64-apple-darwin" ;;
          *)
            echo "Unsupported runner platform: ${RUNNER_OS}/${RUNNER_ARCH}" >&2
            exit 1
            ;;
        esac

        tmpdir="$(mktemp -d)"
        mapfile -t resolved < <(
          deno run -A "${{ github.action_path }}/resolve_release.ts" \
            --repository "${INPUT_REPOSITORY}" \
            --version "${INPUT_VERSION}" \
            --target "${target}" \
            --token "${GH_TOKEN}" \
            --outdir "${tmpdir}"
        )
        tag_name="${resolved[0]}"
        version="${resolved[1]}"
        asset="${resolved[2]}"
        asset_path="${resolved[3]}"
        sums_path="${resolved[4]}"

        expected="$(awk -v name="${asset}" '$2 == name { print $1; exit }' "${sums_path}")"
        if [[ -z "${expected}" ]]; then
          echo "No checksum entry for ${asset}" >&2
          exit 1
        fi

        if command -v sha256sum >/dev/null 2>&1; then
          actual="$(sha256sum "${asset_path}" | awk '{ print $1 }')"
        else
          actual="$(shasum -a 256 "${asset_path}" | awk '{ print $1 }')"
        fi
        if [[ "${actual}" != "${expected}" ]]; then
          echo "Checksum mismatch for ${asset}" >&2
          exit 1
        fi

        bin_dir="${RUNNER_TEMP}/uffda/bin"
        mkdir -p "${bin_dir}"
        if [[ "${target}" == *windows* ]]; then
          install_path="${bin_dir}/uffda.exe"
        else
          install_path="${bin_dir}/uffda"
        fi
        cp "${asset_path}" "${install_path}"
        chmod +x "${install_path}"

        echo "${bin_dir}" >> "${GITHUB_PATH}"
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "target=${target}" >> "${GITHUB_OUTPUT}"
        echo "path=${install_path}" >> "${GITHUB_OUTPUT}"
        echo "Installed uffda ${version} (${target}) from ${tag_name} at ${install_path}"
