on:
  post:
    - kind: regexp
      file: deno.jsonc
      pattern: '(?<="version": ").*(?=",)'
    - kind: regexp
      file: VERSION
      pattern: ".+"
    - kind: regexp
      file: src/version.ts
      pattern: '(?<=export const version = ").*(?=";)'
    - kind: regexp
      file: editors/vscode/src/version.ts
      pattern: '(?<=export const MIN_UFFDA_VERSION = ").*(?=";)'
