on:
  post:
    - kind: regexp
      file: deno.jsonc
      pattern: '(?<="version": ").*(?=",)'
    - kind: regexp
      file: VERSION
      pattern: ".+"
    - kind: regexp
      file: editors/vscode/src/version.ts
      pattern: '(?<=export const MIN_UFFDA_VERSION = ").*(?=";)'
    # Package versions: `^` needs the `m` flag (JS has no inline (?m)).
    - kind: regexp
      file: rust/Cargo.toml
      pattern: '(?<=^version = ").*(?=")'
      flags: m
    - kind: regexp
      file: rust/heap/Cargo.toml
      pattern: '(?<=^version = ").*(?=")'
      flags: m
    - kind: regexp
      file: rust/heap/derive/Cargo.toml
      pattern: '(?<=^version = ").*(?=")'
      flags: m
    - kind: regexp
      file: rust/build/Cargo.toml
      pattern: '(?<=^version = ").*(?=")'
      flags: m
    # Path-dependency version pins for published crates (not third-party deps).
    - kind: regexp
      file: rust/Cargo.toml
      pattern: '(?<=path = "(?:heap|build)", version = ").*(?=")'
      flags: g
    - kind: regexp
      file: rust/heap/Cargo.toml
      pattern: '(?<=path = "derive", version = ").*(?=")'
    - kind: regexp
      file: rust/consumer/Cargo.toml
      pattern: '(?<=path = "(?:\.\.|\.\./build)", version = ").*(?=")'
      flags: g
