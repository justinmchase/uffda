[package]
name = "uffda-heap-derive"
version = "0.10.8"
edition = "2024"
publish = true
license = "MIT"
description = "Derive macros for the Uffda garbage-collected heap"
repository = "https://github.com/justinmchase/uffda"
homepage = "https://github.com/justinmchase/uffda"
documentation = "https://docs.rs/uffda-heap-derive"
readme = "README.md"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.56"
quote = "1.0.26"
syn = { version = "2.0.17", features = ["default", "visit-mut"] }
synstructure = "0.13"
