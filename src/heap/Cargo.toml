[package]
name = "uffda-heap"
version = "0.10.8"
edition = "2024"
publish = true
license = "MIT"
description = "Garbage-collected heap abstraction for the Uffda runtime"
repository = "https://github.com/justinmchase/uffda"
homepage = "https://github.com/justinmchase/uffda"
documentation = "https://docs.rs/uffda-heap"
readme = "README.md"
keywords = ["uffda", "gc", "heap"]
categories = ["memory-management"]

[features]
default = ["gc-arena"]
# Tracing collector backed by the `gc-arena` crate.
gc-arena = ["dep:gc-arena"]
# Diagnostic backend that never frees: allocations are leaked and collection is
# a no-op. Takes precedence over `gc-arena` when both are enabled. Not for
# production use.
leak = []

[dependencies]
uffda-heap-derive = { path = "derive", version = "0.10.8" }
gc-arena = { version = "=0.7.0", optional = true }
